name: Daily Stock Briefing

# 매일 KST 07:00 = UTC 22:00 (전날). 단순 단일 cron / 단일 job 구조.
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

concurrency:
  group: daily-stock-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Diagnostic info
        run: |
          echo "=== Run info ==="
          echo "event: ${{ github.event_name }}"
          echo "ref: ${{ github.ref }}"
          echo "sha: ${{ github.sha }}"
          echo "run_id: ${{ github.run_id }}"
          echo "UTC: $(date -u)"
          echo "KST: $(TZ=Asia/Seoul date)"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write .env from secrets
        run: |
          cat > .env <<EOF
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          EOF
          chmod 600 .env

      - name: Run stock briefing generator
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python scripts/generate_stock_briefing.py

      - name: Upload briefing artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-briefing-${{ github.run_id }}
          path: |
            logs/*.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="WARN: Daily Stock Briefing failed - run ${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" || true
